<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DJ Triplex</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#120b0d;--panel:#1e1316;--line:#3a2529;--ink:#f6ece6;--dim:#b49c95;--red:#d6334a;--gold:#e8b44a;--green:#3fae6e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,Segoe UI,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{margin:0;font-size:22px}
#onair{padding:4px 10px;border-radius:6px;background:#333;font-weight:700;font-size:13px}
#onair.live{background:var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;padding:16px 20px}
.p{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.p h2{margin:0 0 10px;font-size:15px;color:var(--gold)}
label{display:block;font-size:13px;color:var(--dim);margin:10px 0 4px}
input,select,textarea{width:100%;background:#0d0809;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:14px system-ui,sans-serif}
textarea{min-height:90px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row>*{flex:1 1 auto}
button{background:#2b1b1f;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:10px 14px;font:600 14px system-ui,sans-serif;cursor:pointer;min-height:42px}
button:hover{border-color:var(--gold)}
button.go{background:var(--green);border-color:var(--green);color:#06140c}
button.red{background:var(--red);border-color:var(--red)}
.now{font-size:24px;font-weight:700;line-height:1.2}
.artist{color:var(--dim);font-size:16px}
.bar{height:6px;background:#0d0809;border-radius:3px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);width:0}
.next{margin-top:12px;color:var(--dim)}
.req{border-top:1px solid var(--line);padding:9px 0;display:flex;gap:8px;align-items:center}
.req div{flex:1}
.req small{color:var(--dim);display:block}
.tag{font-size:11px;padding:2px 7px;border-radius:5px;background:#333;white-space:nowrap}
.tag.venter{background:var(--gold);color:#000}.tag.klar{background:var(--green);color:#000}.tag.avvist{background:#555}
#log{height:180px;overflow:auto;font:12.5px ui-monospace,Consolas,monospace;color:var(--dim);white-space:pre-wrap}
#qr,#rqr{background:#fff;padding:10px;border-radius:10px;display:inline-block}
summary.h2{list-style:none;cursor:pointer;font-weight:700;color:var(--gold);font-size:15px}
summary.h2::-webkit-details-marker{display:none}
summary.h2::before{content:'▸ '}details[open]>summary.h2::before{content:'▾ '}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;border-radius:0;flex:1}
.seg button.on{background:var(--gold);color:#000}
#big{position:fixed;inset:0;background:#7a1020;display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;z-index:9;cursor:pointer}
#big h2{font:700 clamp(32px,6vw,72px) Georgia,serif;margin:0;color:#fff;text-align:center}
#bigqr{background:#fff;padding:20px;border-radius:20px}
#bignow{color:#ffd9d9;font-size:clamp(18px,2.5vw,30px);text-align:center}
details summary{cursor:pointer;color:var(--gold);font-weight:600}
</style>
</head>
<body>
<header>
  <h1>🎄 DJ Triplex</h1>
  <span id="onair">OFF AIR</span>
  <span id="status" style="color:var(--dim)">Ikke startet</span>
</header>

<div class="grid">
  <section class="p">
    <h2>Spiller nå</h2>
    <div class="now" id="np">–</div>
    <div class="artist" id="na"></div>
    <div class="bar"><i id="nb"></i></div>
    <div class="next" id="nx">Neste: –</div>
    <div class="next" id="src" style="font-size:12px">Siste replikk: –</div>
    <div class="row">
      <button class="go" id="start">▶ Start kvelden</button>
      <button id="pauseDj">⏸ Pause DJ</button>
      <button id="skip">⏭ Hopp over</button>
    </div>
    <div class="row"><button id="musicBtn">⏯ Pause musikken</button></div>
    <label>Stemning</label>
    <div class="seg" id="mode"><button data-m="rolig">🍽 Middag (rolig)</button><button data-m="fest">🕺 Fest</button></div>
    <label for="say">La DJ-en si noe nå</label>
    <div class="row"><input id="say" placeholder="Desserten er servert! Kom og forsyn dere."><button id="sayBtn" style="flex:0 0 auto">🎙 Si det</button></div>
    <label for="ask">Be DJ-en om noe (Claude lager replikken)</label>
    <div class="row"><input id="ask" placeholder="Si at buffeten er påfylt, og utfordre lageret til dansekonkurranse"><button id="askBtn" style="flex:0 0 auto">✨ Lag og si</button></div>
    <label for="volR">Spotify-volum: <span id="volV">–</span></label>
    <div class="row"><button id="volDn" style="flex:0 0 auto">−</button><input id="volR" type="range" min="0" max="100" step="5" style="flex:1"><button id="volUp" style="flex:0 0 auto">+</button></div>
  </section>

  <section class="p">
    <h2>Ønsker</h2>
    <div id="qr"></div>
    <div class="row"><button id="bigBtn">📺 Vis QR i fullskjerm</button><button id="copyUrl">Kopier lenke</button></div>
    <label><input type="checkbox" id="approve" style="width:auto"> Godkjenn ønsker før de spilles</label>
    <div id="reqs"><p style="color:var(--dim)">Ingen ønsker ennå.</p></div>
  </section>

  <section class="p">
    <h2>Spillekista</h2>
    <label for="crate">Format: <code>rolig</code>, <code>fest</code> eller <code>begge</code> | Artist - Låt</label>
    <textarea id="crate" style="min-height:260px"></textarea>
  </section>

  <section class="p"><details id="setup"><summary class="h2">Oppsett</summary>
    <label for="cid">Spotify Client ID</label>
    <input id="cid" value="43791d06e25e45a889936c92ecde0a72" placeholder="fra developer.spotify.com">
    <div class="row"><button id="login">Logg inn på Spotify</button><button id="devBtn">Finn enheter</button></div>
    <label for="dev">Spill på enhet</label>
    <select id="dev"><option value="">(trykk «Finn enheter»)</option></select>
    <label for="voice">Stemme</label>
    <select id="voice"></select>
    <label for="elkey">ElevenLabs API-nøkkel (valgfritt: mye bedre stemme)</label>
    <input id="elkey" type="password" placeholder="sk_…">
    <div class="row"><button id="elVoicesBtn">Hent ElevenLabs-stemmer</button></div>
    <label for="elvoice">ElevenLabs-stemme</label>
    <select id="elvoice"><option value="">(ingen: bruker Edge-stemmen over)</option></select>
    <div class="row"><button id="testVoice">Test stemmen</button></div>
    <label for="every">DJ-en snakker</label>
    <select id="every"><option value="1">Før hver låt</option><option value="2" selected>Hver 2. låt</option><option value="3">Hver 3. låt</option><option value="5">Hver 5. låt</option><option value="999">Kun ved ønsker</option></select>
    <label for="duck">Musikkvolum mens DJ-en snakker (%)</label>
    <input id="duck" type="number" min="5" max="100" value="30">
    <details style="margin-top:12px"><summary>Mer</summary>
      <label for="djname">DJ-navn</label><input id="djname" value="DJ Triplex">
      <label for="event">Om festen (brukes i replikkene)</label><input id="event" value="julebordet til MacGregor (tidligere Triplex) på Molde Fjordhotell, med buffet av varm julemat">
      <label for="about">Om firmaet (brukes i replikkene)</label><textarea id="about">Vi er MacGregor Norway, avdeling Fishery and Research (FAR), på Averøy. Før het vi Triplex AS, og mange sier fortsatt «Triplex». Startet i 1933 som Bjørshol Mekaniske Verksted, ble Triplex AS i 1996, så kom tyske Hatlapa inn i 2011, og nå er vi MacGregor. Søsterbrand: Rapp fra Bodø. Vi lager kraner og dekksutstyr til båter: nettkraner, dekkskraner, nettvinsjer, korkline- og blylinestablere, utstyr til ringnotbåter, trålere, brønnbåter og forskningsskip, også polarskip. Lageret på Averøy har over 6000 ulike reservedeler. Triplex-navnet: tre ting i ett. Avdelinger og gjenger på julebordet: kontorgjengen, lageret og servicegjengen. DJ-en kan heie på dem, utfordre dem til dansekonkurranse mot hverandre og spøke vennlig med dem som gruppe, for eksempel om hvem som er først i buffetkøen, hvem som finner frem på dansegulvet, og om servicegjengen som alltid er ute på oppdrag.</textarea>
      <label for="key">Claude API-nøkkel (valgfritt: friere og morsommere replikker)</label><input id="key" type="password" placeholder="sk-ant-…">
      <label for="elmodel">ElevenLabs-modell</label><input id="elmodel" value="eleven_v3">
      <label for="model">Modell</label><input id="model" value="claude-sonnet-5-5">
      <label for="topic">Ønskekanal (ntfy-topic)</label><input id="topic">
      <label for="black">Svarteliste (ett ord per linje)</label><textarea id="black"></textarea>
      <label>Fjernkontroll for DJ-hjelpere (start, pause, hopp over, stemning, beskjeder)</label>
      <div id="rqr"></div>
      <div class="row"><button id="copyRemote">Kopier fjernkontroll-lenke</button><button id="newRemote">Ny kode (stenger ute gamle)</button></div>
    </details>
  </details></section>


  <section class="p">
    <h2>Logg</h2>
    <div id="log"></div>
  </section>
</div>

<div id="big"><h2>Ønsk deg en låt!</h2><div id="bigqr"></div><div id="bignow"></div></div>

<script>
{
const $ = id => document.getElementById(id);
const LS = {
  get(k, d) { try { const v = localStorage.getItem('dj_' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('dj_' + k, JSON.stringify(v)); } catch {} }
};
const REDIRECT = location.origin + location.pathname;
const SCOPES = 'user-read-playback-state user-modify-playback-state user-read-currently-playing';

const DEFAULT_CRATE = `rolig | Bing Crosby - White Christmas
rolig | Nat King Cole - The Christmas Song
rolig | Frank Sinatra - Let It Snow! Let It Snow! Let It Snow!
rolig | Michael Bublé - It's Beginning to Look a Lot Like Christmas
rolig | Michael Bublé - Holly Jolly Christmas
rolig | Ella Fitzgerald - Sleigh Ride
rolig | Judy Garland - Have Yourself a Merry Little Christmas
rolig | Vince Guaraldi Trio - Christmas Time Is Here
rolig | Elvis Presley - Blue Christmas
rolig | Sissel - Glade jul
rolig | Sissel - Mitt hjerte alltid vanker
rolig | Åge Aleksandersen - Lys og varme
rolig | Vamp - Tir n'a Noir
rolig | Louis Armstrong - What a Wonderful World
begge | Chris Rea - Driving Home for Christmas
begge | Jahn Teigen - Glassjenta
begge | Dance With A Stranger - Everyone Needs a Friend
begge | The Pogues - Fairytale of New York
fest | Wham! - Last Christmas
fest | Mariah Carey - All I Want for Christmas Is You
fest | Brenda Lee - Rockin' Around the Christmas Tree
fest | Bobby Helms - Jingle Bell Rock
fest | Slade - Merry Xmas Everybody
fest | Wizzard - I Wish It Could Be Christmas Everyday
fest | Shakin' Stevens - Merry Christmas Everyone
fest | José Feliciano - Feliz Navidad
fest | DDE - Vinsjan på kaia
fest | DDE - Rai rai
fest | Ace of Base - All That She Wants
fest | Roxette - The Look
fest | Åge Aleksandersen - Fire pils og en pizza
fest | Hellbillies - Ei krasafaren steinbu
fest | Rick Astley - Never Gonna Give You Up
fest | Madonna - Like a Prayer
fest | a-ha - Take On Me
fest | ABBA - Dancing Queen
fest | ABBA - Gimme! Gimme! Gimme!
fest | Queen - Don't Stop Me Now
fest | Whitney Houston - I Wanna Dance with Somebody
fest | Earth, Wind & Fire - September
fest | Bon Jovi - Livin' on a Prayer
fest | Toto - Africa
fest | Cyndi Lauper - Girls Just Want to Have Fun
fest | Dexys Midnight Runners - Come On Eileen
fest | Bee Gees - Stayin' Alive
fest | Lionel Richie - All Night Long
fest | Michael Jackson - Billie Jean
fest | Haddaway - What Is Love
fest | Spice Girls - Wannabe
fest | Backstreet Boys - Everybody (Backstreet's Back)
fest | Vengaboys - We Like to Party!
fest | Aqua - Barbie Girl
fest | Wham! - Wake Me Up Before You Go-Go
fest | Europe - The Final Countdown`;

// ---------- state ----------
let running = false, paused = false, talking = false;
let mode = LS.get('mode', 'rolig');
let cur = { id: null, queued: false };
let nextUp = null;          // {uri, name, artist, request}
let songCount = 0, lastVol = 70, devSupportsVol = true;
const played = new Set();
const playHist = [];
var musicPlaying = null;
const requests = [];        // {id, song, name, note, status}
const recentLines = [];
let timer = null, es = null;

// ---------- utils ----------
function log(msg) {
  const t = new Date().toLocaleTimeString('no-NO', { hour: '2-digit', minute: '2-digit' });
  const l = $('log'); l.textContent = `${t}  ${msg}\n` + l.textContent;
}
const status = s => $('status').textContent = s;
const rand = n => { const a = new Uint8Array(n); crypto.getRandomValues(a); return Array.from(a, b => 'abcdefghijklmnopqrstuvwxyz0123456789'[b % 36]).join(''); };
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const clock = () => new Date().toLocaleTimeString('no-NO', { hour: '2-digit', minute: '2-digit' });
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

// ---------- persisted settings ----------
const fields = ['cid', 'key', 'elkey', 'elmodel', 'model', 'djname', 'event', 'about', 'black', 'duck', 'every', 'crate'];
LS.set('topic', LS.get('topic', null) || 'julebord-' + rand(12));
// Nøkler kan også gis i adressen: dj.html#key=…&elkey=…&elvoice=… (lagres lokalt, fjernes så fra adresselinja)
{ const h = new URLSearchParams(location.hash.slice(1)); let got = false;
  for (const k of ['key', 'elkey', 'elvoice', 'elmodel', 'model']) if (h.get(k)) { LS.set(k, h.get(k)); got = true; }
  if (got) { location.replace(location.pathname + location.search); throw new Error('laster på nytt med nøkler'); } }
window.addEventListener('hashchange', () => { if (/(^|[#&])(key|elkey)=/.test(location.hash)) location.reload(); });
// engangsoppdatering av lagrede tekster fra eldre versjon
{ const ev = LS.get('event', null); if (ev === 'julebordet') LS.set('event', $('event').defaultValue);
  const ab = LS.get('about', null); if (ab && !/kontorgjengen/i.test(ab)) { const d = $('about').defaultValue; LS.set('about', ab.trim() + ' ' + d.slice(d.indexOf('Avdelinger og gjenger'))); } }
for (const f of fields) { const v = LS.get(f, null); if (v !== null) $(f).value = v; for (const ev of ['input', 'change']) $(f).addEventListener(ev, () => LS.set(f, $(f).value)); }
if (!$('crate').value.trim()) $('crate').value = DEFAULT_CRATE;
$('topic').value = LS.get('topic');
$('topic').addEventListener('change', () => { LS.set('topic', $('topic').value.trim()); LS.set('since', null); drawQR(); listen(); });
$('approve').checked = LS.get('approve', false);
$('approve').addEventListener('change', () => LS.set('approve', $('approve').checked));

function setMode(m) { if (m !== 'rolig' && m !== 'fest') return; mode = m; LS.set('mode', m); document.querySelectorAll('#mode button').forEach(b => b.classList.toggle('on', b.dataset.m === m)); pushStatus(); }
document.querySelectorAll('#mode button').forEach(b => b.onclick = () => { setMode(b.dataset.m); log('Stemning: ' + b.dataset.m); });
setMode(mode);

// ---------- Spotify auth (PKCE) ----------
async function login() {
  const cid = $('cid').value.trim();
  if (!cid) return log('⚠ Fyll inn Spotify Client ID først');
  LS.set('cid', cid);
  const verifier = rand(64); LS.set('verifier', verifier);
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  location.href = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({
    client_id: cid, response_type: 'code', redirect_uri: REDIRECT, scope: SCOPES,
    code_challenge_method: 'S256', code_challenge: challenge
  });
}
async function tokenRequest(params) {
  const r = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ client_id: LS.get('cid'), ...params })
  });
  const j = await r.json();
  if (!j.access_token) throw new Error('Spotify-innlogging feilet: ' + (j.error_description || j.error));
  const old = LS.get('tok', {}) || {};
  LS.set('tok', { a: j.access_token, r: j.refresh_token || old.r, exp: Date.now() + (j.expires_in - 60) * 1000 });
}
async function handleCallback() {
  const q = new URLSearchParams(location.search);
  if (q.get('error')) { log('⚠ Spotify: ' + q.get('error')); history.replaceState(null, '', REDIRECT); return; }
  const code = q.get('code'); if (!code) return;
  history.replaceState(null, '', REDIRECT);
  try { await tokenRequest({ grant_type: 'authorization_code', code, redirect_uri: REDIRECT, code_verifier: LS.get('verifier') }); log('✅ Logget inn på Spotify'); }
  catch (e) { log('⚠ ' + e.message); }
}
async function token() {
  const t = LS.get('tok', null);
  if (!t) throw new Error('Ikke logget inn på Spotify');
  if (Date.now() > t.exp) await tokenRequest({ grant_type: 'refresh_token', refresh_token: t.r });
  return LS.get('tok').a;
}
async function sp(method, path, body) {
  const r = await fetch('https://api.spotify.com/v1' + path, {
    method, headers: { Authorization: 'Bearer ' + await token(), ...(body ? { 'Content-Type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined
  });
  const txt = await r.text();
  if (!r.ok) throw new Error(`Spotify ${r.status}: ${txt.slice(0, 140)}`);
  try { return txt ? JSON.parse(txt) : null; } catch { return null; }
}

// ---------- devices ----------
async function findDevices() {
  try {
    const d = await sp('GET', '/me/player/devices');
    const sel = $('dev'); sel.innerHTML = '';
    if (!d.devices.length) { sel.innerHTML = '<option value="">Ingen funnet: åpne Spotify-appen og spill noe kort</option>'; return; }
    for (const x of d.devices) { const o = document.createElement('option'); o.value = x.id; o.textContent = `${x.name} (${x.type})`; if (x.is_active) o.selected = true; sel.appendChild(o); }
    log(`Fant ${d.devices.length} enhet(er)`);
  } catch (e) { log('⚠ ' + e.message); }
}

// ---------- voice ----------
function loadVoices() {
  const vs = speechSynthesis.getVoices(); if (!vs.length) return;
  const sel = $('voice'), saved = LS.get('voice', null); sel.innerHTML = '';
  const nor = vs.filter(v => /^(nb|no|nn)/i.test(v.lang));
  const list = [...nor, ...vs.filter(v => !nor.includes(v))];
  for (const v of list) { const o = document.createElement('option'); o.value = v.name; o.textContent = `${v.name} (${v.lang})`; sel.appendChild(o); }
  const best = saved && list.find(v => v.name === saved) || nor.find(v => /Finn/i.test(v.name)) || nor.find(v => /Natural|Online/i.test(v.name)) || nor[0];
  if (best) sel.value = best.name;
}
speechSynthesis.onvoiceschanged = loadVoices; loadVoices();
$('voice').addEventListener('change', () => LS.set('voice', $('voice').value));
// ---------- ElevenLabs ----------
const elAudio = new Audio();
const stripTags = t => t.replace(/\[[^\]]{1,30}\]\s*/g, '').trim();
const useEL = () => $('elkey').value.trim() && $('elvoice').value;
async function loadElVoices(quiet) {
  const key = $('elkey').value.trim(); if (!key) { if (!quiet) log('⚠ Lim inn ElevenLabs-nøkkel først'); return; }
  try {
    const r = await fetch('https://api.elevenlabs.io/v1/voices', { headers: { 'xi-api-key': key } });
    const j = await r.json(); if (!r.ok) throw new Error(j.detail?.message || j.detail?.status || r.status);
    const sel = $('elvoice'), saved = LS.get('elvoice', null);
    sel.innerHTML = '<option value="">(ingen: bruker Edge-stemmen over)</option>';
    for (const v of j.voices || []) { const o = document.createElement('option'); o.value = v.voice_id; o.textContent = v.name + (v.labels?.accent ? ' – ' + v.labels.accent : '') + (v.category ? ' (' + v.category + ')' : ''); sel.appendChild(o); }
    if (saved && [...sel.options].some(o => o.value === saved)) sel.value = saved;
    if (!quiet) log('✅ Hentet ' + (j.voices || []).length + ' ElevenLabs-stemmer');
  } catch (e) { log('⚠ ElevenLabs: ' + e.message); }
}
$('elVoicesBtn').onclick = () => loadElVoices(false);
$('elvoice').addEventListener('change', () => LS.set('elvoice', $('elvoice').value));
if ($('elkey').value.trim()) loadElVoices(true);
async function sayEL(text) {
  const model = $('elmodel').value.trim() || 'eleven_v3';
  const v3 = /v3|v4/.test(model);
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 15000);
  try {
    const r = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${$('elvoice').value}?output_format=mp3_44100_128`, {
      method: 'POST', signal: ctl.signal,
      headers: { 'xi-api-key': $('elkey').value.trim(), 'content-type': 'application/json', accept: 'audio/mpeg' },
      body: JSON.stringify({ text: v3 ? text : stripTags(text), model_id: model,
        voice_settings: v3 ? { stability: 0.0, similarity_boost: 0.8 } : { stability: 0.3, similarity_boost: 0.8, style: 0.6, use_speaker_boost: true } })
    });
    if (!r.ok) { let m = r.status; try { const j = await r.json(); m = j.detail?.message || j.detail?.status || JSON.stringify(j.detail) || m; } catch {} throw new Error(m); }
    const url = URL.createObjectURL(await r.blob());
    await new Promise((res, rej) => { elAudio.src = url; elAudio.onended = res; elAudio.onerror = () => rej(new Error('avspilling feilet')); elAudio.play().catch(rej); });
    URL.revokeObjectURL(url);
    return true;
  } catch (e) { log('⚠ ElevenLabs: ' + e.message + ' (bruker Edge-stemmen)'); return false; }
  finally { clearTimeout(to); }
}
async function say(text) {
  if (useEL() && await sayEL(text)) return;
  if (useEL()) { lastSrc = lastSrc.replace('ElevenLabs', 'nettleser (ElevenLabs feilet)'); $('src').textContent = 'Siste replikk: ' + lastSrc; }
  return sayBrowser(stripTags(text));
}
function sayBrowser(text) {
  return new Promise(res => {
    const u = new SpeechSynthesisUtterance(text);
    const v = speechSynthesis.getVoices().find(v => v.name === $('voice').value);
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'nb-NO';
    u.rate = 1.08; u.pitch = 1.05;
    const safety = setTimeout(res, 4000 + text.length * 110);
    u.onend = u.onerror = () => { clearTimeout(safety); res(); };
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  });
}
async function setVol(v) { if (!devSupportsVol) return; try { await sp('PUT', '/me/player/volume?volume_percent=' + Math.max(0, Math.min(100, Math.round(v)))); } catch (e) { log('⚠ volum: ' + e.message); } }
let lastSrc = '';
async function onAir(text, src = 'din beskjed') {
  if (talking) return; talking = true; $('onair').className = 'live'; $('onair').textContent = 'ON AIR';
  const vol = lastVol;
  try {
    const voiceSrc = useEL() ? 'ElevenLabs' : 'nettleser';
    lastSrc = src + ' · ' + voiceSrc;
    log(`🎙 [${src} → ${voiceSrc}] ` + stripTags(text));
    $('src').textContent = 'Siste replikk: ' + lastSrc;
    await setVol(vol * (+$('duck').value || 30) / 100);
    await new Promise(r => setTimeout(r, 400));
    await say(text);
  } finally { await setVol(lastVol); talking = false; $('onair').className = ''; $('onair').textContent = 'OFF AIR'; }
}

async function announce(track, req) {

  recentLines.push(line); if (recentLines.length > 6) recentLines.shift();

// ---------- crate & picking ----------
function crate() {
  return $('crate').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const [tag, rest] = l.includes('|') ? l.split('|').map(s => s.trim()) : ['begge', l];
    return { tag: tag.toLowerCase(), q: rest };
  });
}
function blacklisted(text) {
  const t = text.toLowerCase();
  return $('black').value.split('\n').map(s => s.trim().toLowerCase()).filter(Boolean).some(w => t.includes(w));
}
async function resolve(q) {
  const d = await sp('GET', '/search?' + new URLSearchParams({ q, type: 'track', limit: 1 }));
  const it = d?.tracks?.items?.[0];
  return it ? { uri: it.uri, name: it.name, artist: it.artists.map(a => a.name).join(', ') } : null;
}
async function chooseNext() {
  const req = requests.find(r => r.status === 'klar');
  if (req) {
    req.status = 'søker'; renderReqs();
    try {
      const tr = await resolve(req.song);
      if (tr && !blacklisted(tr.name + ' ' + tr.artist)) { req.status = 'i kø'; req.track = tr.name + ' – ' + tr.artist; renderReqs(); return { ...tr, request: req }; }
      req.status = 'avvist'; req.track = tr ? 'svartelistet' : 'fant ikke låta'; log('Ønske ikke spilt: ' + req.song);
    } catch (e) { req.status = 'klar'; log('⚠ ' + e.message); }
    renderReqs();
  }
  let pool = crate().filter(c => (c.tag === mode || c.tag === 'begge') && !played.has(c.q));
  if (!pool.length) { played.clear(); pool = crate().filter(c => c.tag === mode || c.tag === 'begge'); }
  for (let i = 0; i < 4 && pool.length; i++) {
    const c = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
    played.add(c.q);
    const tr = await resolve(c.q).catch(() => null);
    if (tr) return { ...tr, request: null };
    log('Fant ikke: ' + c.q);
  }
  return null;
}
async function queueNext() {
  const n = await chooseNext(); if (!n) return log('⚠ Fant ingen låt å legge i kø');
  await sp('POST', '/me/player/queue?' + new URLSearchParams({ uri: n.uri, ...($('dev').value ? { device_id: $('dev').value } : {}) }));
  nextUp = n; $('nx').textContent = 'Neste: ' + n.name + ' – ' + n.artist + (n.request ? ' (ønske)' : '');
  pushStatus();
}

// ---------- main loop ----------
async function tick() {
  if (!running || paused) return;
  try {
    const st = await sp('GET', '/me/player');
    if (!st || !st.item) { status('Ingen avspilling: sjekk Spotify-appen'); return; }
    if (st.device) { devSupportsVol = st.device.supports_volume !== false; if (!talking && st.device.volume_percent != null && st.device.volume_percent !== lastVol) { lastVol = st.device.volume_percent; showVol(); pushStatus(); } }
    const it = st.item, rem = it.duration_ms - st.progress_ms;
    $('np').textContent = it.name; $('na').textContent = it.artists.map(a => a.name).join(', ');
    $('nb').style.width = (100 * st.progress_ms / it.duration_ms) + '%';
    $('bignow').textContent = '♪ ' + it.name + ' – ' + $('na').textContent;
    status(st.is_playing ? 'Spiller' : 'Pause i Spotify');
    if (musicPlaying !== st.is_playing) { musicPlaying = st.is_playing; $('musicBtn').textContent = musicPlaying ? '⏯ Pause musikken' : '▶ Spill musikken'; pushStatus(); }
    if (it.id !== cur.id) {
      const track = { name: it.name, artist: $('na').textContent };
      const req = nextUp && (nextUp.uri === it.uri || nextUp.name === it.name) ? nextUp.request : null;
      if (req) { req.status = 'spilt'; renderReqs(); }
      const first = cur.id === null;
      cur = { id: it.id, queued: false }; nextUp = null; $('nx').textContent = 'Neste: –';
      songCount++;
      playHist.unshift(track.name + ' – ' + track.artist); playHist.length = Math.min(playHist.length, 8);
      pushStatus();
      if (!first && (req || songCount % (+$('every').value) === 0)) announce(track, req);
    }
    if (!cur.queued && st.is_playing && rem < 30000) { cur.queued = true; await queueNext(); }
  } catch (e) { log('⚠ ' + e.message); }
}

  speechSynthesis.speak(new SpeechSynthesisUtterance('')); // låser opp lyd i nettleseren

    const st = await sp('GET', '/me/player').catch(() => null);

// ---------- requests via ntfy ----------
function guestUrl() { return new URL('index.html', location.href).href.split('?')[0] + '?t=' + encodeURIComponent(LS.get('topic')); }
function drawQR() {
  for (const id of ['qr', 'bigqr']) { $(id).innerHTML = ''; if (window.QRCode) new QRCode($(id), { text: guestUrl(), width: id === 'qr' ? 180 : 420, height: id === 'qr' ? 180 : 420 }); }
}
function addRequest(d, id) {
  const r = { id, song: String(d.song || '').slice(0, 120), name: String(d.name || '').slice(0, 40), note: String(d.note || '').slice(0, 160), status: 'venter' };
  if (!r.song) return;
  if (blacklisted(r.song)) r.status = 'avvist';
  else if (!$('approve').checked) r.status = 'klar';
  requests.unshift(r); renderReqs(); pushStatus();
  log(`📩 Ønske: ${r.song}${r.name ? ' (fra ' + r.name + ')' : ''}`);
}
function listen() {
  if (es) es.close();
  const since = LS.get('since', null) || Math.floor(Date.now() / 1000 - 300);
  es = new EventSource(`https://ntfy.sh/${encodeURIComponent(LS.get('topic'))}/sse?since=${since}`);
  const seen = new Set(requests.map(r => r.id));
  es.onmessage = e => {
    try {
      const m = JSON.parse(e.data); if (m.event !== 'message' || seen.has(m.id)) return;
      seen.add(m.id); LS.set('since', m.id);
      let d; try { d = JSON.parse(m.message); } catch { d = { song: m.message }; }
      addRequest(d, m.id);
    } catch {}
  };
  es.onerror = () => status('Ønskekanal: kobler til på nytt …');
}
function renderReqs() {
  const box = $('reqs'); box.innerHTML = '';
  if (!requests.length) { box.innerHTML = '<p style="color:var(--dim)">Ingen ønsker ennå.</p>'; return; }
  for (const r of requests.slice(0, 30)) {
    const el = document.createElement('div'); el.className = 'req';
    const info = document.createElement('div');
    const title = document.createElement('b'); title.textContent = r.song;
    const sub = document.createElement('small'); sub.textContent = [r.name, r.note, r.track].filter(Boolean).join(' · ');
    info.append(title, sub);
    const tag = document.createElement('span'); tag.className = 'tag ' + (r.status === 'venter' ? 'venter' : r.status === 'avvist' ? 'avvist' : 'klar'); tag.textContent = r.status;
    el.append(info, tag);
    if (r.status === 'venter') {
      const ok = document.createElement('button'); ok.textContent = '✓'; ok.onclick = () => { r.status = 'klar'; renderReqs(); };
      const no = document.createElement('button'); no.textContent = '✕'; no.onclick = () => { r.status = 'avvist'; renderReqs(); };
      el.append(ok, no);
    }
    box.appendChild(el);
  }
}

if (!LS.get('ctl', null)) LS.set('ctl', 'djctl-' + rand(20));
function remoteUrl() { return new URL('remote.html', location.href).href.split('?')[0].split('#')[0] + '#c=' + encodeURIComponent(LS.get('ctl')); }
function drawRemoteQR() { $('rqr').innerHTML = ''; if (window.QRCode) new QRCode($('rqr'), { text: remoteUrl(), width: 160, height: 160 }); }
var ctlEs = null, pushT = null, lastPush = 0;
function statusObj() {
  const crateList = crate().filter(c => c.tag === mode || c.tag === 'begge').map(c => c.q);
  const o = { t: Date.now(), running, paused, talking, music: musicPlaying, vol: devSupportsVol ? lastVol : null, src: lastSrc, mode, np: $('np').textContent, na: $('na').textContent, nx: $('nx').textContent.replace(/^Neste: /, ''),
    hist: playHist.slice(0, 6), reqs: requests.slice(0, 6).map(r => ({ s: r.song, n: r.name, st: r.status })), list: [] };
  for (const q of crateList) { o.list.push(q); if (JSON.stringify(o).length > 3600) { o.list.pop(); o.more = crateList.length - o.list.length; break; } }
  return o;
}
function pushStatus() {
  clearTimeout(pushT);
  const wait = Math.max(0, 6000 - (Date.now() - lastPush)); // ntfy.sh tåler ikke spam
  pushT = setTimeout(async () => {
    lastPush = Date.now();
    try { await fetch('https://ntfy.sh/' + encodeURIComponent(LS.get('ctl') + '-s'), { method: 'POST', body: JSON.stringify(statusObj()) }); } catch {}
  }, Math.max(wait, 400));
}
setInterval(pushStatus, 30000);
// spillelista til gjestesiden (egen kanal: <ønskekanal>-liste)
var listT = null, lastListJson = '';
function pushGuestList(force) {
  clearTimeout(listT);
  listT = setTimeout(async () => {
    const c = crate(), pick = t => c.filter(x => x.tag === t).map(x => x.q);
    const o = { t: Date.now(), m: pick('rolig'), f: pick('fest'), b: pick('begge') };
    while (JSON.stringify(o).length > 3800) { const k = o.f.length >= o.m.length ? 'f' : 'm'; o[k].pop(); o.more = (o.more || 0) + 1; }
    const js = JSON.stringify(o); if (!force && js.replace(/"t":\d+,/, '') === lastListJson) return;
    lastListJson = js.replace(/"t":\d+,/, '');
    try { await fetch('https://ntfy.sh/' + encodeURIComponent(LS.get('topic') + '-liste'), { method: 'POST', body: js }); } catch {}
  }, 1500);
}
$('crate').addEventListener('input', () => pushGuestList(false));
setInterval(() => pushGuestList(true), 6 * 3600 * 1000); // ntfy tar vare på meldinger i 12 timer
async function handleCmd(c) {
  log('📱 Fjernkontroll: ' + c.cmd + (c.m ? ' ' + c.m : ''));
  if (c.cmd === 'start') { if (!running) await start(); else setPaused(false); }
  else if (c.cmd === 'pause') setPaused(true);
  else if (c.cmd === 'resume') setPaused(false);
  else if (c.cmd === 'skip') $('skip').onclick();
  else if (c.cmd === 'music') await setMusic(c.play);
  else if (c.cmd === 'ask' && c.text) askDj(c.text);
  else if (c.cmd === 'vol') await setNormalVol(c.v != null ? +c.v : lastVol + (+c.d || 0));
  else if (c.cmd === 'mode') setMode(c.m);
  else if (c.cmd === 'say' && c.text) onAir(String(c.text).slice(0, 300));
  else if (c.cmd === 'ping') pushStatus();
  pushStatus();
}
function listenCtl() {
  if (ctlEs) ctlEs.close();
  ctlEs = new EventSource(`https://ntfy.sh/${encodeURIComponent(LS.get('ctl'))}/sse?since=${Math.floor(Date.now() / 1000)}`);
  const seen = new Set();
  ctlEs.onmessage = e => {
    try {
      const m = JSON.parse(e.data); if (m.event !== 'message' || seen.has(m.id)) return; seen.add(m.id);
      if (Date.now() / 1000 - m.time > 60) return; // ignorer gamle kommandoer
      handleCmd(JSON.parse(m.message));
    } catch {}
  };
}

$('start').onclick = start;
async function askDj(text) {
  text = String(text || '').trim().slice(0, 300); if (!text) return;
  log('✨ Bestilling: ' + text);
  const line = await claudeLine(null, null, text);
  if (!line) { log('⚠ Fikk ikke laget replikk. Prøv igjen, eller bruk «Si det» for å lese opp ordrett.'); lastSrc = 'bestilling feilet'; pushStatus(); return; }
  recentLines.push(line); if (recentLines.length > 6) recentLines.shift();
  await onAir(line, 'Claude (bestilling)');
}
$('askBtn').onclick = () => { const t = $('ask').value.trim(); if (t) { $('ask').value = ''; askDj(t); } };
$('ask').addEventListener('keydown', e => { if (e.key === 'Enter') $('askBtn').click(); });
function showVol() { $('volV').textContent = devSupportsVol ? lastVol + ' %' : 'ikke støttet på denne enheten'; $('volR').value = lastVol; }
async function setNormalVol(v) {
  v = Math.max(0, Math.min(100, Math.round(v)));
  if (!devSupportsVol) { log('⚠ Spotify-enheten tillater ikke volumstyring'); return; }
  lastVol = v; showVol();
  if (!talking) await setVol(v);
  log('🔊 Spotify-volum: ' + v + ' %'); pushStatus();
}
$('volR').addEventListener('change', () => setNormalVol(+$('volR').value));
$('volDn').onclick = () => setNormalVol(lastVol - 10);
$('volUp').onclick = () => setNormalVol(lastVol + 10);
async function setMusic(play) {
  const dev = $('dev').value ? '?device_id=' + encodeURIComponent($('dev').value) : '';
  try {
    if (play === undefined) { const st = await sp('GET', '/me/player'); play = !(st && st.is_playing); }
    await sp('PUT', '/me/player/' + (play ? 'play' : 'pause') + dev);
    musicPlaying = play; $('musicBtn').textContent = play ? '⏯ Pause musikken' : '▶ Spill musikken';
    log(play ? '▶ Musikken spiller igjen' : '⏸ Musikken satt på pause'); pushStatus();
  } catch (e) { log('⚠ Musikk: ' + e.message); }
}
$('musicBtn').onclick = () => setMusic();
function setPaused(p) { if (!running) return; paused = p; $('pauseDj').textContent = paused ? '▶ Fortsett DJ' : '⏸ Pause DJ'; log(paused ? 'DJ på pause (musikken går)' : 'DJ tilbake'); pushStatus(); }
$('pauseDj').onclick = () => setPaused(!paused);
$('skip').onclick = async () => {
  const btn = $('skip'); if (btn.disabled) return; btn.disabled = true;
  try {
    const dev = $('dev').value ? '?device_id=' + encodeURIComponent($('dev').value) : '';
    if (cur.queued && nextUp) { await sp('POST', '/me/player/next' + dev); log('⏭ Hopper til ' + nextUp.name); }
    else {
      const n = nextUp || await chooseNext(); if (!n) return log('⚠ Fant ingen låt å hoppe til');
      await sp('PUT', '/me/player/play' + dev, { uris: [n.uri] });
      nextUp = n; log('⏭ Hopper til ' + n.name);
    }
    if (running && !paused) setTimeout(tick, 800);
  } catch (e) { log('⚠ Hopp over: ' + e.message); }
  finally { btn.disabled = false; }
};
$('sayBtn').onclick = () => { const t = $('say').value.trim(); if (t) { onAir(t); $('say').value = ''; } };
$('testVoice').onclick = () => say(`Hei hei! Dette er ${$('djname').value}, og jeg er klar for ${$('event').value}!`);
$('bigBtn').onclick = () => { $('big').style.display = 'flex'; };
$('big').onclick = () => { $('big').style.display = 'none'; };
$('copyUrl').onclick = async () => { try { await navigator.clipboard.writeText(guestUrl()); log('Lenke kopiert: ' + guestUrl()); } catch { log(guestUrl()); } };

handleCallback().then(() => { if (LS.get('tok', null)) findDevices(); });
drawQR(); listen(); renderReqs(); drawRemoteQR(); listenCtl(); showVol(); pushStatus(); pushGuestList(true);
log('Klar. Gjesteside: ' + guestUrl());
}
