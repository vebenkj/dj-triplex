<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DJ Triplex</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#120b0d;--panel:#1e1316;--line:#3a2529;--ink:#f6ece6;--dim:#b49c95;--red:#d6334a;--gold:#e8b44a;--green:#3fae6e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,Segoe UI,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{margin:0;font-size:22px}
#onair{padding:4px 10px;border-radius:6px;background:#333;font-weight:700;font-size:13px}
#onair.live{background:var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;padding:16px 20px}
.wide{grid-column:1/-1}
#crate{min-height:420px;font-size:16px;line-height:1.6;padding:12px 14px}
#plan{font-size:17px;line-height:1.45;max-height:calc(100vh - 210px);overflow:auto}
#plan .it{display:flex;align-items:center;gap:10px;padding:7px 8px;border-bottom:1px solid var(--line);border-radius:6px}
#plan .it .t{flex:1}
#plan .it .mk{width:26px;text-align:center}
#plan .it button{padding:4px 10px;font-size:13px;opacity:.55}
#plan .it:hover button{opacity:1}
#plan .done{color:var(--dim);text-decoration:line-through;opacity:.6}
#plan .now{background:var(--gold);color:#000;font-weight:700}
#plan .next{outline:2px solid var(--gold)}
#plan .head{color:var(--gold);font-weight:700;padding:8px 8px 4px;font-size:14px}
@media (min-width:1100px){
  #crate{min-height:calc(100vh - 210px)}
  .grid{grid-template-columns:minmax(300px,1fr) minmax(300px,1fr) minmax(380px,1.5fr);align-items:start}
  .wide{grid-column:3;grid-row:1/span 2}
  #setupSec{grid-column:1/span 2}
}
.p{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.p h2{margin:0 0 10px;font-size:15px;color:var(--gold)}
label{display:block;font-size:13px;color:var(--dim);margin:10px 0 4px}
input,select,textarea{width:100%;background:#0d0809;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:14px system-ui,sans-serif}
textarea{min-height:90px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row>*{flex:1 1 auto}
button{background:#2b1b1f;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:10px 14px;font:600 14px system-ui,sans-serif;cursor:pointer;min-height:42px}
button:hover{border-color:var(--gold)}
button.go{background:var(--green);border-color:var(--green);color:#06140c}
button.red{background:var(--red);border-color:var(--red)}
.now{font-size:24px;font-weight:700;line-height:1.2}
.artist{color:var(--dim);font-size:16px}
.bar{height:6px;background:#0d0809;border-radius:3px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);width:0}
.next{margin-top:12px;color:var(--dim)}
.req{border-top:1px solid var(--line);padding:9px 0;display:flex;gap:8px;align-items:center}
.req div{flex:1}
.req small{color:var(--dim);display:block}
.tag{font-size:11px;padding:2px 7px;border-radius:5px;background:#333;white-space:nowrap}
.tag.venter{background:var(--gold);color:#000}.tag.klar{background:var(--green);color:#000}.tag.avvist{background:#555}
#log{height:220px;overflow:auto;font:12.5px ui-monospace,Consolas,monospace;color:var(--dim);white-space:pre-wrap}
#qr,#rqr{background:#fff;padding:10px;border-radius:10px;display:inline-block}
input.secret{-webkit-text-security:disc;font-family:ui-monospace,Consolas,monospace}
summary.h2{list-style:none;cursor:pointer;font-weight:700;color:var(--gold);font-size:15px}
summary.h2::-webkit-details-marker{display:none}
summary.h2::before{content:'▸ '}details[open]>summary.h2::before{content:'▾ '}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;border-radius:0;flex:1}
.seg button.on{background:var(--gold);color:#000}
#big{position:fixed;inset:0;background:#7a1020;display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;z-index:9;cursor:pointer}
#big h2{font:700 clamp(32px,6vw,72px) Georgia,serif;margin:0;color:#fff;text-align:center}
#bigqr{background:#fff;padding:20px;border-radius:20px}
#bignow{color:#ffd9d9;font-size:clamp(18px,2.5vw,30px);text-align:center}
details summary{cursor:pointer;color:var(--gold);font-weight:600}
</style>
</head>
<body>
<header>
  <h1>🎄 DJ Triplex</h1>
  <span id="onair">OFF AIR</span>
  <span id="status" style="color:var(--dim)">Ikke startet</span>
</header>

<div class="grid">
  <section class="p">
    <h2>Spiller nå</h2>
    <div class="now" id="np">–</div>
    <div class="artist" id="na"></div>
    <div class="bar"><i id="nb"></i></div>
    <div class="next" id="nx">Neste: –</div>
    <div class="next" id="src" style="font-size:12px">Siste replikk: –</div>
    <div class="row">
      <button class="go" id="start">▶ Start kvelden</button>
      <button id="pauseDj">⏸ Pause DJ</button>
      <button id="skip">⏭ Hopp over</button>
    </div>
    <div class="row"><button id="musicBtn">⏯ Pause musikken</button></div>
    <label>Stemning</label>
    <div class="seg" id="mode"><button data-m="rolig">🍽 Middag (rolig)</button><button data-m="fest">🕺 Fest</button></div>
    <label for="say">La DJ-en si noe nå</label>
    <div class="row"><input id="say" placeholder="Desserten er servert! Kom og forsyn dere."><button id="sayBtn" style="flex:0 0 auto">🎙 Si det</button></div>
    <label for="ask">Be DJ-en om noe (Claude lager replikken)</label>
    <div class="row"><input id="ask" placeholder="Si at buffeten er påfylt, og utfordre lageret til dansekonkurranse"><button id="askBtn" style="flex:0 0 auto">✨ Lag og si</button></div>
    <label for="masterR">🎚 Master (styrer begge): <span id="masterV">–</span></label>
    <div class="row"><button id="masterDn" style="flex:0 0 auto">−</button><input id="masterR" type="range" min="0" max="100" step="5" style="flex:1"><button id="masterUp" style="flex:0 0 auto">+</button></div>
    <label for="volR">🎵 Musikk (Spotify): <span id="volV">–</span></label>
    <div class="row"><button id="volDn" style="flex:0 0 auto">−</button><input id="volR" type="range" min="0" max="100" step="5" style="flex:1"><button id="volUp" style="flex:0 0 auto">+</button></div>
    <label for="voiceR">🎙 DJ-stemme: <span id="voiceV">–</span></label>
    <div class="row"><button id="voiceDn" style="flex:0 0 auto">−</button><input id="voiceR" type="range" min="0" max="100" step="5" style="flex:1"><button id="voiceUp" style="flex:0 0 auto">+</button></div>
  </section>

  <section class="p">
    <h2>Ønsker</h2>
    <div id="qr"></div>
    <div class="row"><button id="bigBtn">📺 Vis QR i fullskjerm</button><button id="copyUrl">Kopier lenke</button></div>
    <label><input type="checkbox" id="approve" style="width:auto"> Godkjenn ønsker før de spilles</label>
    <div id="reqs"><p style="color:var(--dim)">Ingen ønsker ennå.</p></div>
    <h2 style="margin-top:16px">Logg</h2>
    <div id="log"></div>
  </section>

  <section class="p wide">
    <h2>Spillelista <span id="planMode" style="color:var(--dim);font-weight:400"></span></h2>
    <div class="row"><button id="editCrate" style="flex:0 0 auto">✏️ Rediger lista</button><label style="margin:0;flex:1"><input type="checkbox" id="shuffle" style="width:auto"> Tilfeldig rekkefølge</label></div>
    <div id="plan"></div>
    <div id="crateBox" style="display:none">
      <label for="crate">Format: <code>rolig</code>, <code>fest</code> eller <code>begge</code> | Artist - Låt. Lista spilles ovenfra og ned.</label>
      <textarea id="crate"></textarea>
    </div>
  </section>

  <section class="p" id="setupSec"><details id="setup"><summary class="h2">Oppsett</summary>
    <details id="genBox" style="margin:10px 0 14px;border:1px solid var(--line);border-radius:10px;padding:10px">
      <summary style="cursor:pointer;font-weight:600">✨ Lag ny spilleliste med Claude</summary>
      <label for="genDesc">Beskriv lista du vil ha</label>
      <textarea id="genDesc" style="min-height:80px;font:14px system-ui,sans-serif" placeholder="Rolige julesanger til middagen (norske og internasjonale). Til festen: 80- og 90-tallsfest, allsang, litt norsk pop og noen julelåter med fart."></textarea>
      <div class="row"><label style="margin:0;flex:1">Antall låter <input id="genN" type="number" min="10" max="150" value="60" style="width:80px"></label>
        <label style="margin:0;flex:1"><input type="checkbox" id="genCheck" checked style="width:auto"> Sjekk at låtene finnes på Spotify</label></div>
      <div class="row"><button id="genBtn">✨ Lag forslag</button></div>
      <p id="genStatus" style="color:var(--dim);font-size:13px;margin:6px 0"></p>
      <textarea id="genOut" style="display:none;min-height:220px"></textarea>
      <div class="row" id="genActs" style="display:none"><button id="genReplace">Erstatt lista</button><button id="genAppend">Legg til nederst</button><button id="genDiscard">Forkast</button></div>
    </details>
    <label for="cid">Spotify Client ID</label>
    <input id="cid" value="43791d06e25e45a889936c92ecde0a72" placeholder="fra developer.spotify.com">
    <div class="row"><button id="login">Logg inn på Spotify</button><button id="devBtn">Finn enheter</button></div>
    <label for="dev">Spill på enhet</label>
    <select id="dev"><option value="">(trykk «Finn enheter»)</option></select>
    <label for="voice">Stemme</label>
    <select id="voice"></select>
    <label for="elkey">ElevenLabs API-nøkkel (valgfritt: mye bedre stemme)</label>
    <input id="elkey" type="text" class="secret" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore data-form-type="other" placeholder="sk_…">
    <div class="row"><button id="elVoicesBtn">Hent ElevenLabs-stemmer</button></div>
    <label for="elvoice">ElevenLabs-stemme</label>
    <select id="elvoice"><option value="">(ingen: bruker Edge-stemmen over)</option></select>
    <label for="lang">Språk for replikker</label>
    <select id="lang"><option value="no">Norsk</option><option value="mix">Norsk med engelske radiouttrykk</option><option value="en">Engelsk</option><option value="nm">Nordmørsk preg (Averøy)</option></select>
    <div class="row"><button id="testVoice">Test stemmen</button></div>
    <label for="every">DJ-en snakker</label>
    <select id="every"><option value="1">Før hver låt</option><option value="2" selected>Hver 2. låt</option><option value="3">Hver 3. låt</option><option value="5">Hver 5. låt</option><option value="999">Kun ved ønsker</option></select>
    <label for="duck">Musikkvolum mens DJ-en snakker (%)</label>
    <input id="duck" type="number" min="5" max="100" value="30">
    <details style="margin-top:12px"><summary>Mer</summary>
      <label for="djname">DJ-navn</label><input id="djname" value="DJ Triplex">
      <label for="event">Om festen (brukes i replikkene)</label><input id="event" value="julebordet til MacGregor (tidligere Triplex) på Molde Fjordhotell, med buffet av varm julemat">
      <label for="about">Om firmaet (brukes i replikkene)</label><textarea id="about">Vi er MacGregor Norway, avdeling Fishery and Research (FAR), på Averøy. Før het vi Triplex AS, og mange sier fortsatt «Triplex». Startet i 1933 som Bjørshol Mekaniske Verksted, ble Triplex AS i 1996, så kom tyske Hatlapa inn i 2011, og nå er vi MacGregor. Søsterbrand: Rapp fra Bodø. Vi lager kraner og dekksutstyr til båter: nettkraner, dekkskraner, nettvinsjer, korkline- og blylinestablere, utstyr til ringnotbåter, trålere, brønnbåter og forskningsskip, også polarskip. Lageret på Averøy har over 6000 ulike reservedeler. Triplex-navnet: tre ting i ett. Avdelinger og gjenger på julebordet: kontorgjengen, lageret og servicegjengen. DJ-en kan heie på dem, utfordre dem til dansekonkurranse mot hverandre og spøke vennlig med dem som gruppe, for eksempel om hvem som er først i buffetkøen, hvem som finner frem på dansegulvet, og om servicegjengen som alltid er ute på oppdrag.</textarea>
      <label for="key">Claude API-nøkkel (valgfritt: friere og morsommere replikker)</label><input id="key" type="text" class="secret" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore data-form-type="other" placeholder="sk-ant-…">
      <label for="elmodel">ElevenLabs-modell</label><input id="elmodel" value="eleven_v3">
      <label for="model">Modell</label><input id="model" value="claude-sonnet-5-5">
      <label for="topic">Ønskekanal (ntfy-topic)</label><input id="topic">
      <label for="ntfytok">ntfy-tilgangsnøkkel (Supporter-konto, valgfritt: gir 2 500 meldinger i døgnet i stedet for 250 per nett)</label>
      <input id="ntfytok" type="text" class="secret" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore data-form-type="other" placeholder="tk_…">
      <label for="black">Svarteliste (ett ord per linje)</label><textarea id="black"></textarea>
      <label>Fjernkontroll for DJ-hjelpere (start, pause, hopp over, stemning, beskjeder)</label>
      <div id="rqr"></div>
      <div class="row"><button id="copyRemote">Kopier fjernkontroll-lenke</button><button id="newRemote">Ny kode (stenger ute gamle)</button></div>
    </details>
  </details></section>


</div>

<div id="big"><h2>Ønsk deg en låt!</h2><div id="bigqr"></div><div id="bignow"></div></div>

<script>
{
const $ = id => document.getElementById(id);
const LS = {
  get(k, d) { try { const v = localStorage.getItem('dj_' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('dj_' + k, JSON.stringify(v)); } catch {} }
};
const REDIRECT = location.origin + location.pathname;
const SCOPES = 'user-read-playback-state user-modify-playback-state user-read-currently-playing';

const DEFAULT_CRATE = `rolig | Bing Crosby - White Christmas
rolig | Nat King Cole - The Christmas Song
rolig | Frank Sinatra - Let It Snow! Let It Snow! Let It Snow!
rolig | Michael Bublé - It's Beginning to Look a Lot Like Christmas
rolig | Michael Bublé - Holly Jolly Christmas
rolig | Ella Fitzgerald - Sleigh Ride
rolig | Judy Garland - Have Yourself a Merry Little Christmas
rolig | Vince Guaraldi Trio - Christmas Time Is Here
rolig | Elvis Presley - Blue Christmas
rolig | Sissel - Glade jul
rolig | Sissel - Mitt hjerte alltid vanker
rolig | Åge Aleksandersen - Lys og varme
rolig | Vamp - Tir n'a Noir
rolig | Louis Armstrong - What a Wonderful World
begge | Chris Rea - Driving Home for Christmas
begge | Jahn Teigen - Glassjenta
begge | Dance With A Stranger - Everyone Needs a Friend
begge | The Pogues - Fairytale of New York
fest | Wham! - Last Christmas
fest | Mariah Carey - All I Want for Christmas Is You
fest | Brenda Lee - Rockin' Around the Christmas Tree
fest | Bobby Helms - Jingle Bell Rock
fest | Slade - Merry Xmas Everybody
fest | Wizzard - I Wish It Could Be Christmas Everyday
fest | Shakin' Stevens - Merry Christmas Everyone
fest | José Feliciano - Feliz Navidad
fest | DDE - Vinsjan på kaia
fest | DDE - Rai rai
fest | Ace of Base - All That She Wants
fest | Roxette - The Look
fest | Åge Aleksandersen - Fire pils og en pizza
fest | Hellbillies - Ei krasafaren steinbu
fest | Rick Astley - Never Gonna Give You Up
fest | Madonna - Like a Prayer
fest | a-ha - Take On Me
fest | ABBA - Dancing Queen
fest | ABBA - Gimme! Gimme! Gimme!
fest | Queen - Don't Stop Me Now
fest | Whitney Houston - I Wanna Dance with Somebody
fest | Earth, Wind & Fire - September
fest | Bon Jovi - Livin' on a Prayer
fest | Toto - Africa
fest | Cyndi Lauper - Girls Just Want to Have Fun
fest | Dexys Midnight Runners - Come On Eileen
fest | Bee Gees - Stayin' Alive
fest | Lionel Richie - All Night Long
fest | Michael Jackson - Billie Jean
fest | Haddaway - What Is Love
fest | Spice Girls - Wannabe
fest | Backstreet Boys - Everybody (Backstreet's Back)
fest | Vengaboys - We Like to Party!
fest | Aqua - Barbie Girl
fest | Wham! - Wake Me Up Before You Go-Go
fest | Europe - The Final Countdown`;

// ---------- state ----------
let running = false, paused = false, talking = false;
let mode = LS.get('mode', 'rolig');
let cur = { id: null, queued: false };
let nextUp = null;          // {uri, name, artist, request}
let songCount = 0, lastVol = 70, devSupportsVol = true;
var musicVol = LS.get('musicVol', null), voiceVol = LS.get('voiceVol', 100), masterVol = LS.get('masterVol', 100);
const clampV = v => Math.max(0, Math.min(100, Math.round(+v || 0)));
const voiceGain = () => clampV(voiceVol) * clampV(masterVol) / 10000;
const played = new Set();
const playHist = [];
var musicPlaying = null, nowQ = null, nowReq = null; const doneQ = new Set();
const requests = [];        // {id, song, name, note, status}
const recentLines = [];
let timer = null, es = null;

// ---------- utils ----------
function log(msg) {
  const t = new Date().toLocaleTimeString('no-NO', { hour: '2-digit', minute: '2-digit' });
  const l = $('log'); l.textContent = `${t}  ${msg}\n` + l.textContent;
}
const status = s => $('status').textContent = s;
const rand = n => { const a = new Uint8Array(n); crypto.getRandomValues(a); return Array.from(a, b => 'abcdefghijklmnopqrstuvwxyz0123456789'[b % 36]).join(''); };
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const clock = () => new Date().toLocaleTimeString('no-NO', { hour: '2-digit', minute: '2-digit' });
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

// ---------- persisted settings ----------
const fields = ['cid', 'key', 'ntfytok', 'elkey', 'elmodel', 'model', 'lang', 'djname', 'event', 'about', 'black', 'duck', 'every', 'crate'];
{ const sh = LS.get('shuffle', null); if (sh !== null) $('shuffle').checked = sh; $('shuffle').addEventListener('change', () => LS.set('shuffle', $('shuffle').checked)); }
LS.set('topic', LS.get('topic', null) || 'julebord-' + rand(12));
// Nøkler kan også gis i adressen: dj.html#key=…&elkey=…&ntfytok=…&elvoice=… (lagres lokalt, fjernes så fra adresselinja)
{ const h = new URLSearchParams(location.hash.slice(1)); let got = false;
  for (const k of ['key', 'elkey', 'ntfytok', 'elvoice', 'elmodel', 'model']) if (h.get(k)) { LS.set(k, h.get(k)); got = true; }
  if (got) { location.replace(location.pathname + location.search); throw new Error('laster på nytt med nøkler'); } }
window.addEventListener('hashchange', () => { if (/(^|[#&])(key|elkey)=/.test(location.hash)) location.reload(); });
// engangsoppdatering av lagrede tekster fra eldre versjon
{ const ev = LS.get('event', null); if (ev === 'julebordet') LS.set('event', $('event').defaultValue);
  const ab = LS.get('about', null); if (ab && !/kontorgjengen/i.test(ab)) { const d = $('about').defaultValue; LS.set('about', ab.trim() + ' ' + d.slice(d.indexOf('Avdelinger og gjenger'))); } }
for (const f of fields) { const v = LS.get(f, null); if (v !== null) $(f).value = v; for (const ev of ['input', 'change']) $(f).addEventListener(ev, () => LS.set(f, $(f).value)); }
if (!$('crate').value.trim()) $('crate').value = DEFAULT_CRATE;
$('topic').value = LS.get('topic');
$('topic').addEventListener('change', () => { LS.set('topic', $('topic').value.trim()); LS.set('since', null); drawQR(); listen(); });
$('approve').checked = LS.get('approve', false);
$('approve').addEventListener('change', () => LS.set('approve', $('approve').checked));

function setMode(m) { if (m !== 'rolig' && m !== 'fest') return; mode = m; LS.set('mode', m); document.querySelectorAll('#mode button').forEach(b => b.classList.toggle('on', b.dataset.m === m)); pushStatus(); if (window.renderPlan) renderPlan(); }
document.querySelectorAll('#mode button').forEach(b => b.onclick = () => { setMode(b.dataset.m); log('Stemning: ' + b.dataset.m); });
setMode(mode);

// ---------- Spotify auth (PKCE) ----------
async function login() {
  const cid = $('cid').value.trim();
  if (!cid) return log('⚠ Fyll inn Spotify Client ID først');
  LS.set('cid', cid);
  const verifier = rand(64); LS.set('verifier', verifier);
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  location.href = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({
    client_id: cid, response_type: 'code', redirect_uri: REDIRECT, scope: SCOPES,
    code_challenge_method: 'S256', code_challenge: challenge
  });
}
async function tokenRequest(params) {
  const r = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ client_id: LS.get('cid'), ...params })
  });
  const j = await r.json();
  if (!j.access_token) throw new Error('Spotify-innlogging feilet: ' + (j.error_description || j.error));
  const old = LS.get('tok', {}) || {};
  LS.set('tok', { a: j.access_token, r: j.refresh_token || old.r, exp: Date.now() + (j.expires_in - 60) * 1000 });
}
async function handleCallback() {
  const q = new URLSearchParams(location.search);
  if (q.get('error')) { log('⚠ Spotify: ' + q.get('error')); history.replaceState(null, '', REDIRECT); return; }
  const code = q.get('code'); if (!code) return;
  history.replaceState(null, '', REDIRECT);
  try { await tokenRequest({ grant_type: 'authorization_code', code, redirect_uri: REDIRECT, code_verifier: LS.get('verifier') }); log('✅ Logget inn på Spotify'); }
  catch (e) { log('⚠ ' + e.message); }
}
async function token() {
  const t = LS.get('tok', null);
  if (!t) throw new Error('Ikke logget inn på Spotify');
  if (Date.now() > t.exp) await tokenRequest({ grant_type: 'refresh_token', refresh_token: t.r });
  return LS.get('tok').a;
}

function crate() {
  return $('crate').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const [tag, rest] = l.includes('|') ? l.split('|').map(s => s.trim()) : ['begge', l];

  });
}
function blacklisted(text) {
  const t = text.toLowerCase();
  return $('black').value.split('\n').map(s => s.trim().toLowerCase()).filter(Boolean).some(w => t.includes(w));
}
async function resolve(q) {
  const d = await sp('GET', '/search?' + new URLSearchParams({ q, type: 'track', limit: 1 }));
  const it = d?.tracks?.items?.[0];
  return it ? { uri: it.uri, name: it.name, artist: it.artists.map(a => a.name).join(', ') } : null;
}
async function chooseNext() {
  const req = requests.find(r => r.status === 'klar');
  if (req) {
    req.status = 'søker'; renderReqs();
    try {
      const tr = await resolve(req.song);
      if (tr && !blacklisted(tr.name + ' ' + tr.artist)) { req.status = 'i kø'; req.track = tr.name + ' – ' + tr.artist; renderReqs(); return { ...tr, request: req }; }
      req.status = 'avvist'; req.track = tr ? 'svartelistet' : 'fant ikke låta'; log('Ønske ikke spilt: ' + req.song);
    } catch (e) { req.status = 'klar'; log('⚠ ' + e.message); }
    renderReqs();
  }
  let pool = crate().filter(c => (c.tag === mode || c.tag === 'begge') && !played.has(c.q));
  if (!pool.length) { played.clear(); pool = crate().filter(c => c.tag === mode || c.tag === 'begge'); }
  for (let i = 0; i < 4 && pool.length; i++) {
    const c = pool.splice($('shuffle').checked ? Math.floor(Math.random() * pool.length) : 0, 1)[0];
    played.add(c.q);
    const tr = await resolve(c.q).catch(() => null);
    if (tr) return { ...tr, request: null, q: c.q };
    log('Fant ikke: ' + c.q);
  }
  return null;
}

    if (it.id !== cur.id) {

      const req = match ? nextUp.request : null;

      nowQ = match ? (nextUp.q || null) : null; nowReq = req ? (req.song + (req.name ? ' (ønske fra ' + req.name + ')' : ' (ønske)')) : null;
      if (req) { req.status = 'spilt'; renderReqs(); }
      const first = cur.id === null;

      songCount++;

function listen() {

// ntfy.sh gir 250 meldinger per døgn per IP-adresse. Status sendes derfor bare

var lastRemote = 0, ntfyBlockedUntil = 0, ntfyWarned = false;
async function ntfyPost(topic, body) {
  if (Date.now() < ntfyBlockedUntil) return false;
  try {
    const r = await fetch('https://ntfy.sh/' + encodeURIComponent(topic), { method: 'POST', body, headers: ntfyAuth() });
    if (r.status === 429) {
      let reset = Date.now() + 15 * 60000;
      try { const a = await (await fetch('https://ntfy.sh/v1/account', { headers: ntfyAuth() })).json(); if (a?.stats?.messages_remaining === 0 && a.stats.reset_at) reset = a.stats.reset_at * 1000; } catch {}
      ntfyBlockedUntil = reset;
      if (!ntfyWarned) { ntfyWarned = true; log('⚠ ntfy-kvoten for denne internettforbindelsen er brukt opp (' + (ntfyTok() ? 'kontoens døgnkvote' : '250 meldinger per døgn') + '). Fjernkontroll-status og spilleliste til gjestene stopper til ca. kl. ' + new Date(reset).toTimeString().slice(0, 5) + '. Ønsker og kommandoer fra mobiler på annet nett virker fortsatt. Tips: koble laptopen til mobil-hotspot.'); }
      return false;
    }
    return r.ok;
  } catch { return false; }
}
function pushStatus(force) {

  pushT = setTimeout(() => { lastPush = Date.now(); ntfyPost(LS.get('ctl') + '-s', JSON.stringify(statusObj())); }, Math.max(wait, 400));
}

async function handleCmd(c) {
  const wasIdle = !(Date.now() - (lastRemote || 0) <= 300000); lastRemote = Date.now();
  if (c.cmd === 'ping') { if (wasIdle) log('📱 Fjernkontroll koblet til'); pushStatus(true); return; }
  log('📱 Fjernkontroll: ' + c.cmd + (c.m ? ' ' + c.m : ''));
  if (c.cmd === 'start') { if (!running) await start(); else setPaused(false); }
  else if (c.cmd === 'pause') setPaused(true);
  else if (c.cmd === 'resume') setPaused(false);
  else if (c.cmd === 'skip') $('skip').onclick();
  else if (c.cmd === 'music') await setMusic(c.play);
  else if (c.cmd === 'ask' && c.text) askDj(c.text);
  else if (c.cmd === 'vol') await setNormalVol(c.v != null ? +c.v : (musicVol ?? lastVol) + (+c.d || 0));
  else if (c.cmd === 'voice') setVoiceVol(c.v != null ? +c.v : voiceVol + (+c.d || 0));
  else if (c.cmd === 'master') await setMaster(c.v != null ? +c.v : masterVol + (+c.d || 0));
  else if (c.cmd === 'mode') setMode(c.m);
  else if (c.cmd === 'say' && c.text) onAir(String(c.text).slice(0, 300));
  pushStatus();
}

}

async function callClaude(system, user, { timeout = 120000, maxTokens = 8000 } = {}) {
  const key = $('key').value.trim(); if (!key) throw new Error('mangler Claude API-nøkkel (Oppsett → Mer)');
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), timeout);
  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST', signal: ctl.signal,
      headers: { 'x-api-key': key, 'anthropic-version': '2023-06-01', 'content-type': 'application/json', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: $('model').value.trim() || 'claude-sonnet-5-5', max_tokens: maxTokens, system, messages: [{ role: 'user', content: user }] })
    });
    const j = await r.json(); if (!r.ok) throw new Error(j.error?.message || r.status);
    const text = (j.content || []).filter(c => c.type === 'text').map(c => c.text).join('\n').trim();
    if (!text) throw new Error('tomt svar (stop_reason: ' + (j.stop_reason || '?') + ')');
    return text;
  } catch (e) { throw e.name === 'AbortError' ? new Error('brukte mer enn ' + Math.round(timeout / 1000) + ' sekunder') : e; }
  finally { clearTimeout(to); }
}
